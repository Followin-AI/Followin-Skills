id: leo-btc
name: Leo
role: BTC swing trader
profile:
  age: 33
  experience: 6 年 crypto，主战 BTC 现货+合约 swing
  style: 4h-日线级别 swing，看盘面 + 鲸鱼 + 资金面
  pain_points:
    - 错过鲸鱼大单调仓
    - 盘面 + on-chain 信号不同步
    - 资金费率拐点（没直接数据，要反推）

watchlist:
  primary: [BTC, ETH]
  cross_check: [HYPE, BNB, SOL]   # 流动性 + dominance 参考

trigger_style:
  language: zh-cn
  examples:
    - "BTC 4 小时 K 线"
    - "BTC 鲸鱼最近什么动作"
    - "BTC RSI 现在多少"
    - "BTC 跌为啥 看看新闻"

# 目标：测 crypto quote + OHLCV + 技术指标 + 鲸鱼仓位 + 资金费率反推 的整合准确度
# 同时承接原 quinn 的 OHLCV / interval / RSI 边界测试 (移到 BTC 场景下)
daily_script:
  - step: 1
    intent: BTC OHLCV 日线长历史
    natural_input: "BTC 日线 最近 90 天"
    expected_skill: metrics keywords=[BTC] interval=1day limit
    accuracy_check:
      - 90 个数据点完整返回（crypto 不分交易日）
      - 每条 OHLC 满足 high >= max(open,close), low <= min(open,close)
      - 抽 5 天与 Binance / CoinGecko 历史 K 线对齐 (±0.5%)
  - step: 2
    intent: BTC 4h K 线 + RSI
    natural_input: "BTC 4 小时 K 线 + RSI 14"
    expected_skill: metrics keywords=[BTC] interval=4hour + technicals period=14
    accuracy_check:
      - 4h interval 数据时间戳严格 4 小时间隔（无 gap）
      - RSI 14 数值与 TradingView BTC/USDT 4h RSI 一致 (±0.5)
      - 数据时间窗合理（最近至少 50 根 4h K 线）
  - step: 3
    intent: BTC 1min 分钟级
    natural_input: "BTC 最近 1 天 1 分钟 K 线"
    expected_skill: metrics keywords=[BTC] interval=1min time_range=1d
    accuracy_check:
      - 数据点数 ≈ 1440（crypto 24 小时不停盘）
      - 时间戳无 gap
      - 最近一根 K 线在 1-5 分钟内
  - step: 4
    intent: 鲸鱼 + 顶级交易员 BTC 仓位
    natural_input: "BTC 鲸鱼和顶级交易员最近 4 小时仓位"
    expected_skill: signal trader_position keywords=[BTC] time_range=4h
    accuracy_check:
      - 同时返回 _sub_source: top_traders 和 whale_traders
      - 鲸鱼仓位数学自洽：当前仓位价值 ≈ 持仓数量 × BTC 当前价 (±2%)
      - 清算价格与开仓价 + 杠杆数学一致（多头清算价 < 开仓价；空头清算价 > 开仓价）
      - 100% 胜率低回撤 / Loracle 等已知鲸鱼地址连续追踪不出现断点
  - step: 5
    intent: BTC 多源新闻整合
    natural_input: "BTC 最近 1 小时所有源"
    expected_skill: news query=BTC time_range=1h（不限 source）
    accuracy_check:
      - 同时返回 feeds (media) + telegram + 不出现 twitter degraded (B-12)
      - 各 source 的 BTC 命中率 100%（无 B-06 静默兜底）
      - 多语言版本可识别（如同主题中英文是否重复）
  - step: 6
    intent: 资金费率反推 + xyz 链上美股
    natural_input: "Hyperliquid xyz: 系列代币化美股鲸鱼仓位"
    expected_skill: signal trader_position keywords=[xyz:SNDK,xyz:MU,xyz:MRVL]
    accuracy_check:
      - xyz: 前缀的 tokenized stock 仓位能正常返回
      - 仓位价值与对应美股当日价格数学相关
      - 这是 Followin 独家覆盖维度，应有非空结果

success_criteria:
  - BTC OHLCV 5 天与 Binance 100% 对齐
  - RSI 14 vs TradingView 偏差 <0.5
  - 鲸鱼仓位数学自洽率 100%（开仓价/清算价/杠杆一致）
  - xyz 链上美股至少 3 个 ticker 有非空 trader_position
