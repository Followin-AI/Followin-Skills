id: hedy
name: Hedy
role: 美股短线交易者
profile:
  age: 32
  experience: 5 年美股，自营资金 30 万美元
  style: 趋势跟踪 + 财报事件驱动，T+1 ~ T+5
  pain_points:
    - 错过财报 beat 后的 gap up
    - 内部人 / 政客交易看不及时

watchlist:
  core:    [NVDA, AAPL, MSFT, GOOGL, META, AMZN, TSLA, AVGO, AMD, TSM]
  swing:   [MU, SNDK, LITE, CRCL, MDB, NET, SHOP, COIN, PLTR, HOOD]
  dividend:[JPM, V, WMT, XOM, LLY, JNJ, PG]

trigger_style:
  language: zh-cn
  examples:
    - "NVDA 财报怎么样"
    - "Pelosi 最近又买了啥"
    - "全面分析下 MU"

# 目标：测美股 fundamentals + insider + 涨跌榜 的信息准确度
daily_script:
  - step: 1
    intent: 反向查 watchlist 拿本周财报日期
    natural_input: "我观察名单这周有哪几个要发财报"
    expected_skill: metrics fundamentals (reverse-lookup next_earnings_estimate)
    accuracy_check:
      - 返回的 next_earnings_estimate.date 与公司 IR 页面 / Nasdaq earnings calendar 实际日期一致
      - lastUpdated 字段在 t-2 天内
      - epsEstimated 数值与 Refinitiv/FactSet 共识对齐（±5%）
  - step: 2
    intent: 宏观盘前
    natural_input: "10年期国债 + VIX + 实际利率"
    expected_skill: metrics macro DGS10 / VIXCLS / DFII10
    accuracy_check:
      - 各指标的最新 value 与 FRED 官网 (fred.stlouisfed.org) 数值精确一致
      - date 在 t-1（昨天）或 t-3（周末跨过）以内
  - step: 3
    intent: 涨跌榜清洗
    natural_input: "今天美股涨幅榜，市值大于50亿"
    expected_skill: metrics movers + min_market_cap=5_000_000_000
    accuracy_check:
      - 返回的每只股票实际 marketCap 都 >= 5B（vs Yahoo Finance）
      - changePercentage 与 Google Finance 当日涨幅一致
      - 不出现 leveraged ETF / 仙股
  - step: 4
    intent: 内部人 + 政客一起拿
    natural_input: "NVDA 最近 1 个月内部人交易（含政客）"
    expected_skill: signal insider_trading keywords=[NVDA]
    accuracy_check:
      - Form 4 类 (_source: corporate_insider) 的 _source.url 能在 SEC EDGAR 打开并匹配 reportingName + price
      - 政客类 (_source: congress) 的 link 能在 House clerk 打开
      - 三源（Form 4 + Senate + House）都覆盖
  - step: 5
    intent: 单股财报深度
    natural_input: "MU 全面分析"
    expected_skill: metrics fundamentals MU
    accuracy_check:
      - latest_quarter.revenue 与 Micron 10-Q (sec.gov) 数字对齐
      - beat_miss.epsActual 与 IR earnings release 对齐
      - consensus_price 区间与 Yahoo Finance Analyst Estimates 对齐
      - eps_trend 4 季节奏与官方一致
  - step: 6
    intent: 14 sub-source 真聚合压力测试
    natural_input: "NVDA 14 块财务全部"
    expected_skill: metrics fundamentals NVDA query="全面分析" verbosity=detail
    accuracy_check:
      - 返回 fired_sources_ids 包含 14 个 sub-source 中至少 12 个非空
      - balance_sheet.totalAssets / totalLiabilities 与 NVDA 10-Q 对齐
      - cash_flow.operatingCashFlow 与 10-Q 对齐
      - dcf.dcf 价格在 ±20% 合理区间（vs Finbox / Stockanalysis）
      - key_metrics_ttm.peRatioTTM / pbRatioTTM 与 Yahoo Statistics 对齐
      - ratios_ttm.grossProfitMarginTTM 与 macrotrends 对齐
      - stock_peers 至少返回 5 个同行 ticker
      - financial_growth.revenueGrowth YoY 与 IR 增速一致
      - 不出现 _skipped_sources_ids 占比 >40%

success_criteria:
  - 至少 3 笔 SEC EDGAR Form 4 URL 可打开并字段对齐
  - 至少 2 只 fundamentals 与官方 10-Q 对齐
  - 涨跌榜返回数据 100% 实际 marketCap >= 阈值
