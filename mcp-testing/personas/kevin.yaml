id: kevin
name: Kevin
role: Crypto 资讯散户 / 上班族
profile:
  age: 30
  experience: 持币 2 年，主要 BTC + ETH + 几个山寨，不做合约
  style: 早上通勤 + 午休 + 睡前各刷一次资讯，看大势不看 K 线
  pain_points:
    - 不想看 K 线，只想知道"最近发生了什么"
    - 怕错过重大事件（ETF 通过 / 黑客 / 大跌大涨）
    - 看不懂 on-chain 数据，喜欢看人话总结

watchlist:
  holdings: [BTC, ETH, SOL, SUI]
  curious_about: 偶尔关注 meme / 新叙事

trigger_style:
  language: zh-cn, 完全口语
  examples:
    - "BTC 最近怎么了"
    - "今天 crypto 有啥大事"
    - "ETH 这波跌为啥"
    - "SOL 最近什么消息"
    - "圈里最近在聊什么"
    - "有啥重要新闻"

# 目标：测 news 工具在"泛问 / 大白话"场景下的命中率 + 多源整合度
daily_script:
  - step: 1
    intent: 早上"发生了什么"泛问
    natural_input: "BTC 最近 24 小时有啥大事"
    expected_skill: news query=BTC time_range=1d
    accuracy_check:
      - 返回内容真为重大事件（不是闲聊 / 喊单）
      - 含多源混合：feeds (media) + telegram + twitter
      - 抽 3 条 source_url 可打开且标题对齐
      - 不出现 B-06 静默兜底（与 BTC 无关的头条）
  - step: 2
    intent: 单币消息（小白习惯不带 ticker 前缀）
    natural_input: "以太坊最近什么消息"
    expected_skill: news query=ETH 或 query=Ethereum
    accuracy_check:
      - "以太坊" → ETH/Ethereum 别名自动解析（文档明说要客户端做，这里测命中率）
      - 返回内容真与 ETH 相关
  - step: 3
    intent: 完全泛问"圈里在聊什么"
    natural_input: "crypto 圈最近在聊什么热点"
    expected_skill: news 不带 query / 或 trending
    accuracy_check:
      - 不出现 B-06 静默兜底（拿到 WSJ 大头条）
      - 返回的是真"圈里热点"（含 ticker / 项目名 / 叙事关键词）
      - source_quality 不全是 low
  - step: 4
    intent: 山寨币消息
    natural_input: "SUI 最近什么新闻"
    expected_skill: news query=SUI
    accuracy_check:
      - 返回内容真与 SUI 区块链相关（不是 SUI 重名歧义）
      - 至少 3 条 1d 内
  - step: 5
    intent: 重大事件查询
    natural_input: "最近有没有 ETF 相关的大事"
    expected_skill: news query="ETF" time_range=1w
    accuracy_check:
      - 返回内容真涉及 crypto ETF（不返回美股 ETF 通用新闻）
      - 时间窗 1w 内
      - 重要事件有覆盖：申请、批准、资金流入流出
  - step: 6
    intent: news 高级参数差异 — 召回深浅 + 长文源
    natural_input: "BTC ETF 深度搜索 + YouTube/Medium 长文"
    expected_skill: 2 次调用 — (a) news query="BTC ETF" search_depth=quick (b) news sources=[youtube,medium] query="BTC"
    accuracy_check:
      - quick vs standard 同 query 召回数差异有明显梯度（standard >= quick × 1.2）
      - quick 返回内容仍与 query 相关（不出现 B-06 兜底）
      - sources=[youtube] 返回的 source_name 为 YouTube 频道（CoinBureau / Bankless 等）
      - sources=[medium] 返回长文 (Substack-like) 且 content 长度明显高于 feeds 平均

# 这个 persona 是最容易撞 B-06 静默兜底问题的——
# 小白用户全部用泛问，不会精确拼 query，
# 测出 news 工具在"用户表达模糊"时的真实命中率

success_criteria:
  - 5 个 step 全部命中真实相关内容（无静默兜底）
  - 至少 1 个 step 验证中文别名自动解析（"以太坊" → ETH）
  - 至少 3 条新闻 source_url 可打开对齐
  - source_quality 分布合理（不全是 low）
