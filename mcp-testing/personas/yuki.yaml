id: yuki
name: Yuki
role: 多语言情报官（中英双语）
profile:
  age: 29
  experience: 4 年 crypto research，中英双语母语级
  style: 整合中英两个语言圈的一手信息，做信息差套利
  pain_points:
    - 英文 CT 与中文圈信息时间差（通常英文先，中文跟上 30 分钟）
    - 同一事件中英两边角度差异
    - 跨语言去重

watchlist:
  languages: [en, zh-cn]
  source_priorities:
    en: [twitter (英文 CT), feeds (CoinDesk/The Block), telegram (英文 alpha 群)]
    zh-cn: [telegram (中文交易群 / 喊单群), feeds (Odaily/PANews), twitter (中文 KOL)]

trigger_style:
  language: zh-cn + en mixed
  examples:
    - "BTC 最近 1 小时英文 CT 在说什么"
    - "中文圈对 ETH 这波怎么看"
    - "对比下中英两边对 Solana 的态度"

# 目标：测中英双语源的覆盖度 + 语言标签准确度 + 跨语言去重
daily_script:
  - step: 1
    intent: 英文 feeds 命中
    natural_input: "BTC 最近 1 小时英文新闻"
    expected_skill: news query=BTC source_lang=en time_range=1h
    accuracy_check:
      - 返回每条 source_lang=en 且 content 真为英文
      - source_url 可打开且标题对齐
      - 时间在 1h 窗口内
  - step: 2
    intent: 中文圈对同主题
    natural_input: "中文媒体对 BTC 最近 1 小时报道"
    expected_skill: news query=BTC source_lang=zh-cn time_range=1h
    accuracy_check:
      - source_name 是中文圈源（Odaily / PANews / Wu Blockchain / 链闻 等）
      - content 为简体中文
  - step: 3
    intent: 跨语言去重压力测试
    natural_input: "BTC 最近 1 小时任何语言"
    expected_skill: news query=BTC time_range=1h（不限语言）
    accuracy_check:
      - **关键**：同一新闻的 en + zh-cn 版本，是否合并去重 / 还是各算一条
      - 实测已知问题：B-15 同一 Bitfinex LTH 新闻 3 语言独立返回
      - 至少要标注 "_cross_lang_duplicate_of: <feed_id>" 才算准确
  - step: 4
    intent: 中文 TG 群
    natural_input: "中文 TG 交易信号群最近 4 小时"
    expected_skill: news sources=[telegram] source_lang=zh-cn time_range=4h
    accuracy_check:
      - 抽 3 条 author_name@telegram 可在 TG web 找到对应频道
      - content 真为简体或繁体中文
      - _tg_category 标签语义正确
  - step: 5
    intent: 中英时间差观察
    natural_input: "找一条今天先在英文圈传开、然后中文圈才跟进的新闻"
    expected_skill: 2 次 news 调用 source_lang=en/zh-cn + 客户端 timestamp 比对
    accuracy_check:
      - 能定位至少 1 个事件，en 最早 ts < zh-cn 最早 ts（>15 分钟差）
      - 两边 content 主题确实是同一事件

success_criteria:
  - 抽样 5 条英文源 source_url 100% 可打开
  - 跨语言重复率有明确统计（即使没去重也要能识别出来）
  - 至少 1 个真实"英→中"时间差案例
