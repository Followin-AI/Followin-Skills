id: olivia
name: Olivia
role: 机构 PM / 13F 跟踪者
profile:
  age: 42
  experience: 12 年买方，现独立小机构
  style: 跟踪明星基金持仓变化 + 13F 季度博弈

watchlist:
  funds_to_track:
    - Berkshire Hathaway        # Buffett
    - Pershing Square           # Ackman
    - Scion Asset Management    # Burry
    - ARK Invest                # Wood
    - Bridgewater               # Dalio

trigger_style:
  language: zh-cn + en
  examples:
    - "Buffett 最新持仓"
    - "ARK 最近加了什么"

# 目标：测 signal institutional (13F) 的数据准确度 + 时效性
daily_script:
  - step: 1
    intent: 明星基金最新 13F
    natural_input: "Berkshire 最新一期 13F"
    expected_skill: signal institutional keywords=[Berkshire]
    accuracy_check:
      - 返回的 top 持仓与 SEC EDGAR Berkshire 最新 13F-HR filing 对齐
      - 报告期 (reportDate / quarter) 与 SEC 一致
      - holding amount / shares 字段非空且数值合理
  - step: 2
    intent: 单股的机构持仓
    natural_input: "NVDA 机构持仓 top 10"
    expected_skill: signal institutional keywords=[NVDA]
    accuracy_check:
      - 返回的 top 10 持有人与 WhaleWisdom / Nasdaq institutional holders 页面一致
      - 持仓变化 (change_pct or shares_change) 字段存在
  - step: 3
    intent: Burry 做空
    natural_input: "Burry 最近 13F"
    expected_skill: signal institutional keywords=[Scion]
    accuracy_check:
      - 返回的 puts/calls 信息与 SEC EDGAR Scion 13F 对齐
      - 时间戳与最新季度披露一致 (t-45 内)
  - step: 4
    intent: ARK 加仓 vs 减仓
    natural_input: "ARK Invest 最近季度变动"
    expected_skill: signal institutional keywords=[ARK]
    accuracy_check:
      - 加仓 / 减仓字段语义正确
      - 与 ARK Invest 官网每日披露交叉（ARK 是少数日更披露的基金）
  - step: 5
    intent: 跨基金共持
    natural_input: "Buffett 和 Ackman 都在持有的票"
    expected_skill: 2 次 institutional 调用 + 客户端 intersect
    accuracy_check:
      - 各自返回结果都完整
      - 客户端 join 后的标的与 WhaleWisdom 双重持有列表对齐
  - step: 6
    intent: 单股机构面字段集合 (fundamentals 视角)
    natural_input: "NVDA 流通股 + SEC 最近申报 + 企业价值"
    expected_skill: metrics fundamentals NVDA query="股本 SEC 企业价值" verbosity=detail
    accuracy_check:
      - shares_float.freeFloat 与 Nasdaq institutional ownership 页面对齐
      - sec_filings 至少返回最近 5 份 10-K/10-Q/8-K，type 字段语义正确
      - sec_filings 每条 finalLink 可在 EDGAR 打开
      - enterprise_values.enterpriseValue 与 marketCap + debt - cash 数学自洽
      - enterprise_values.numberOfShares 与 shares_float 一致

success_criteria:
  - 至少 3 个明星基金的 top 持仓与 SEC EDGAR 对齐
  - NVDA top 10 机构持仓与公开数据库一致
  - 报告期 freshness 符合 13F 法定 t-45 披露规则
