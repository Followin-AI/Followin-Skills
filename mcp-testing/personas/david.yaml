id: david
name: David
role: 黄金 / 大宗交易员
profile:
  age: 45
  experience: 15 年大宗，转做 ETF 套利
  style: 月度仓位调整，看实际利率方向

watchlist:
  metals_etfs: [GLD, SLV, IAU]
  gold_stocks: [NEM, FNV, AEM, GOLD]
  macro: [DFII10, T10YIE, VIXCLS]

trigger_style:
  language: zh-cn
  examples:
    - "黄金 ETF 现价"
    - "实际利率走势"
    - "NEM 财报"

# 目标：测黄金ETF行情 + 黄金股财报 + 宏观指标 三路数据准确度
daily_script:
  - step: 1
    intent: 黄金 ETF 现价
    natural_input: "GLD / IAU / SLV 现价"
    expected_skill: metrics keywords=[GLD,IAU,SLV]
    accuracy_check:
      - 价格与 Yahoo Finance / Google Finance 当日收盘一致
      - timestamp 在合理窗口内
      - 三只都命中
  - step: 2
    intent: 实际利率
    natural_input: "DFII10 最近 30 天"
    expected_skill: metrics macro DFII10 time_range=1m
    accuracy_check:
      - 30 天数据点数 ≈ 22 个交易日
      - 每日 value 与 fred.stlouisfed.org/series/DFII10 一致
  - step: 3
    intent: 通胀预期 + 实际利率组合
    natural_input: "T10YIE 和 DFII10 最近 1 周"
    expected_skill: metrics macro batch
    accuracy_check:
      - 两个 series 时间戳逐日对齐
      - 数学关系: DGS10 ≈ DFII10 + T10YIE （±0.1% 容差）
  - step: 4
    intent: 黄金股财报
    natural_input: "NEM Q1 财报"
    expected_skill: metrics fundamentals NEM
    accuracy_check:
      - latest_quarter.revenue 与 Newmont 10-Q (sec.gov) 数字对齐
      - eps 历史 4 季与 IR 报告对齐
      - consensus_price 区间与 Yahoo Finance Analyst Estimates 对齐
  - step: 5
    intent: 黄金股对比
    natural_input: "NEM 跟 FNV 估值对比"
    expected_skill: metrics fundamentals batch [NEM, FNV]
    accuracy_check:
      - 两个 entity 各自字段完整
      - profile_block.sector 都标 Basic Materials
      - 不出现 token 截断导致只回一支
  - step: 6
    intent: DCF 估值 + TTM 关键指标
    natural_input: "NEM DCF 估值 + TTM 主要财务比率"
    expected_skill: metrics fundamentals NEM query="DCF TTM" verbosity=detail
    accuracy_check:
      - dcf.dcf 数值与 Stockanalysis.com / Finbox NEM DCF 在 ±25% 内
      - dcf.stockPrice 与 metrics.market NEM 当日价对齐 (±2%)
      - key_metrics_ttm.peRatioTTM 与 Yahoo Statistics 对齐
      - ratios_ttm.dividendYielTTM (含 typo) 与 NEM 实际派息率对齐
      - 时间戳为最新季度

success_criteria:
  - 黄金 ETF 价格 3/3 与 Yahoo 对齐
  - FRED 实际利率 + 通胀预期数学自洽（DGS10 ≈ DFII10+T10YIE）
  - NEM/FNV 财报与 SEC 10-Q 对齐
