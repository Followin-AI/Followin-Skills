id: mark
name: Mark
role: BTC 宏观研究员
profile:
  age: 38
  experience: 8 年 crypto + 宏观，管 200 万美元 BTC 长仓
  style: 宏观自上而下，月度调仓

watchlist:
  crypto: [BTC, ETH]
  macro_indicators: [DGS10, DFII10, T10YIE, FEDFUNDS, M2SL, VIXCLS]

trigger_style:
  language: zh-cn
  examples:
    - "BTC 现在几分"
    - "实际利率最近怎么走"
    - "VIX 历史分位"

# 目标：测 FRED 宏观指标 + BTC 行情 + 经济日历的准确度
daily_script:
  - step: 1
    intent: BTC 现价 + 24h 走势
    natural_input: "BTC 现价 + 最近 24 小时"
    expected_skill: metrics keywords=[BTC]
    accuracy_check:
      - 价格与 CoinGecko / Binance spot 当下一致（±0.5%）
      - timestamp 在 5 分钟内
  - step: 2
    intent: 10年期实际利率
    natural_input: "10 年期 TIPS 实际利率"
    expected_skill: metrics macro DFII10
    accuracy_check:
      - 最新 value 与 fred.stlouisfed.org/series/DFII10 一致
      - date 在 t-2 内
  - step: 3
    intent: 联邦基金利率
    natural_input: "联邦基金利率最近"
    expected_skill: metrics macro FEDFUNDS
    accuracy_check:
      - value 与 FRED FEDFUNDS series 一致
      - 用户需注意 FEDFUNDS 月更（t-30）— freshness 标注应反映这点
  - step: 4
    intent: M2 货币供应历史
    natural_input: "M2 最近半年走势"
    expected_skill: metrics macro M2SL date_from
    accuracy_check:
      - 6 个月点数全部命中且与 FRED 月度数对齐
      - 日期升序/降序明确（实测返回降序）
  - step: 5
    intent: 经济日历
    natural_input: "本周美国宏观日历"
    expected_skill: metrics macro calendar
    accuracy_check:
      - 返回事件名 / 时间 / country 与 Investing.com economic calendar 对齐
      - impact 字段（High/Medium/Low）非空
      - estimate / previous 数值与官方对齐
  - step: 6
    intent: news categories 过滤验证 + 长文源
    natural_input: "宏观分类新闻 + Medium 上宏观博客"
    expected_skill: 2 次调用 — (a) news categories=[macro] time_range=1d (b) news sources=[medium] query="macro Fed"
    accuracy_check:
      - categories=[macro] 返回内容真为宏观主题（CPI/Fed/利率/GDP），不混入个股新闻
      - 与不带 categories 调用对比，召回主题更聚焦
      - sources=[medium] 返回 Substack-like 长文，author 字段含个人作者名

success_criteria:
  - 5 个 FRED series 全部与 fred.stlouisfed.org 数值对齐
  - BTC 价格与 3 个 CEX 现货均价偏差 <0.5%
  - 经济日历至少 3 个高影响事件可与 Investing.com 对齐
